type: vertical-stack
cards:
  # CARD CHÍNH: giữ thanh biểu tượng gốc, trạng thái và biểu đồ lịch sử
  - type: custom:washing-machine-card
    appliance_type: washer
    name: XIAOMI WASH 12KG
    status_entity: sensor.mibx5_f91_77fa_washer
    running_states:
      - Busy
      - Paused
    remaining_entity: sensor.mibx5_f91_77fa_left_time
    plug_entity: switch.mibx5_f91_77fa_switch_status
    notify_entity: switch.mibx5_f91_77fa_alarm
    confirm_plug_off: true
    show_raw_status: true
    language: en
    theme: auto

  # TÓM TẮT TRỰC QUAN
  - type: grid
    columns: 2
    square: false
    cards:
      - type: tile
        entity: sensor.mibx5_f91_77fa_washer
        name: Trạng thái máy
        icon: mdi:washing-machine
        color: blue
      - type: tile
        entity: sensor.mibx5_f91_77fa_left_time
        name: Thời gian còn lại
        icon: mdi:timer-sand
        color: teal
      - type: tile
        entity: sensor.mibx5_f91_77fa_door_state
        name: Cửa máy
        icon: mdi:door
        color: amber
      - type: tile
        entity: sensor.mibx5_f91_77fa_device_fault
        name: Kiểm tra lỗi
        icon: mdi:shield-check
        color: green

  # ĐIỀU KHIỂN MÁY
  - type: grid
    columns: 5
    square: false
    cards:
      - type: button
        name: Bắt đầu
        icon: mdi:play-circle
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.mibx5_f91_77fa_start_wash
      - type: button
        name: Tạm dừng
        icon: mdi:pause-circle
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.mibx5_f91_77fa_pause
      - type: button
        name: Dừng
        icon: mdi:stop-circle
        tap_action:
          action: perform-action
          perform_action: button.press
          confirmation:
            text: Bạn chắc chắn muốn dừng chương trình giặt?
          target:
            entity_id: button.mibx5_f91_77fa_stop_washing
      - type: button
        name: Mở cửa
        icon: mdi:door-open
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.mibx5_f91_77fa_make_cabin_openable
      - type: button
        name: Thông tin
        icon: mdi:information-outline
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.mibx5_f91_77fa_info

  - type: entities
    title: 🧺 Chương trình giặt
    show_header_toggle: false
    state_color: true
    entities:
      - entity: select.mibx5_f91_77fa_mode
        name: Chế độ giặt
      - entity: select.mibx5_f91_77fa_target_temperature
        name: Nhiệt độ
      - entity: select.mibx5_f91_77fa_spin_speed
        name: Tốc độ vắt
      - entity: select.mibx5_f91_77fa_rinsh_times
        name: Số lần xả
      - entity: select.mibx5_f91_77fa_wash_time
        name: Thời gian giặt
      - entity: select.mibx5_f91_77fa_soak_time
        name: Thời gian ngâm
      - entity: select.mibx5_f91_77fa_shake_time
        name: Chống nhăn

  - type: grid
    columns: 2
    square: false
    cards:
      - type: entities
        title: 🌬️ Sấy
        show_header_toggle: false
        entities:
          - entity: select.mibx5_f91_77fa_drying_degree
            name: Độ sấy
          - entity: select.mibx5_f91_77fa_drying_level
            name: Cấp độ sấy
          - entity: select.mibx5_f91_77fa_drying_time
            name: Thời gian sấy
      - type: entities
        title: ⏰ Hẹn giờ
        show_header_toggle: false
        entities:
          - entity: select.mibx5_f91_77fa_reservation_wash_status
            name: Trạng thái hẹn
          - entity: select.mibx5_f91_77fa_reservation_left_time
            name: Thời gian chờ

  - type: entities
    title: ✨ Tính năng thông minh
    show_header_toggle: false
    state_color: true
    entities:
      - entity: switch.mibx5_f91_77fa_ai_mode
        name: Giặt AI
      - entity: switch.mibx5_f91_77fa_steam_sterilization
        name: Khử khuẩn hơi nước
      - entity: switch.mibx5_f91_77fa_high_water_switch
        name: Mực nước cao
      - entity: switch.mibx5_f91_77fa_physical_control_locked
        name: Khóa bảng điều khiển
      - entity: switch.mibx5_f91_77fa_sleep_mode
        name: Chế độ ngủ
      - entity: switch.mibx5_f91_77fa_alarm
        name: Âm báo máy
      - entity: switch.mibx5_f91_77fa_switch_status
        name: Bật/tắt máy

  - type: entities
    title: 📊 Trạng thái & thống kê
    show_header_toggle: false
    entities:
      - entity: sensor.mibx5_f91_77fa_washer
        name: Trạng thái máy (có lịch sử)
      - entity: sensor.mibx5_f91_77fa_run_status
        name: Trạng thái chương trình
      - entity: sensor.mibx5_f91_77fa_left_time
        name: Phút còn lại
      - entity: sensor.mibx5_f91_77fa_door_state
        name: Cửa máy
      - entity: sensor.mibx5_f91_77fa_device_fault
        name: Lỗi thiết bị
      - entity: sensor.mibx5_f91_77fa_has_washed_times
        name: Tổng số lần đã giặt

  - type: entities
    title: ☁️ Dữ liệu phụ từ Cloud / Data Logging
    show_header_toggle: false
    entities:
      - entity: sensor.mibx5_f91_77fa_fault
        name: Cloud - lỗi
      - entity: sensor.mibx5_f91_77fa_run_status_2
        name: Cloud - trạng thái
      - entity: sensor.mibx5_f91_77fa_left_time_2
        name: Cloud - thời gian còn lại
      - entity: sensor.mibx5_f91_77fa_door_state_2
        name: Logging - cửa máy
      - entity: sensor.mibx5_f91_77fa_water_temperature
        name: Cloud - nhiệt độ nước
      - entity: select.mibx5_f91_77fa_spin_speed_2
        name: Logging - tốc độ vắt
      - entity: select.mibx5_f91_77fa_target_temperature_2
        name: Logging - nhiệt độ
      - entity: select.mibx5_f91_77fa_shake_time_2
        name: Logging - chống nhăn
      - entity: select.mibx5_f91_77fa_soak_time_2
        name: Logging - ngâm
      - entity: select.mibx5_f91_77fa_wash_time_2
        name: Logging - thời gian giặt
